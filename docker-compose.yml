services:
  db:
    image: postgres:15-alpine
    container_name: fudo_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-fudo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fudo_password}
      POSTGRES_DB: ${DB_NAME:-fudo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fudo_user} -d ${DB_NAME:-fudo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fudo_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-fudo_db}
      DB_USER: ${DB_USER:-fudo_user}
      DB_PASSWORD: ${DB_PASSWORD:-fudo_password}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-default_secret_key_change_in_production}
      BUNDLE_PATH: /usr/local/bundle
      BUNDLE_APP_CONFIG: /usr/local/bundle
      PATH: /usr/local/bundle/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "9292:9292"
    volumes:
      - .:/app
    command: sh -c "bundle check || bundle install && bundle exec rerun --pattern '**/*.{rb,ru,yaml}' --ignore '**/*.log' -- bundle exec puma -b tcp://0.0.0.0:9292 config.ru 2>/dev/null"

  dozzle:
    image: amir20/dozzle:latest
    container_name: fudo_dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: 300

volumes:
  postgres_data:
